server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Photos are uploaded through this proxy; the backend limits files to 5 MB.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API: same origin as the site, so the browser never needs CORS.
  location /graphql {
    proxy_pass http://backend:4000/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Live auction updates (socket.io)
  location /socket.io/ {
    proxy_pass http://backend:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths are handled by the router (it renders the 404 page itself).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
