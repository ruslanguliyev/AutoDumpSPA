# AvtoBaz: database + API + website in one command.
#
#   cp .env.example .env     # then edit the secrets
#   docker compose up -d --build
#
# The site is served at http://localhost:${WEB_PORT:-8080}. See DEPLOY.md.
name: autobaz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autobaz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-autobaz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autobaz}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Only needed if the API is called from another origin than the site itself.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    # The API is reachable only through the website container (see frontend/nginx.conf).

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /graphql
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  uploads:
